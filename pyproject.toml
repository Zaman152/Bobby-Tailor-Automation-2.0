[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bobbytailor"
version = "2.0.0"
description = "Bobby Tailor Automation - automated construction take-off from StackCT drawings and PDFs"
# NOTE: the deployment/test runtime is Python 3.9 (macOS system python); the
# package must remain installable there during the Phase 21 transition.
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.44.0",
    "anthropic>=0.28.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "flask-login>=0.6.3",
    "flask-bcrypt>=1.0.1",
    "flask-wtf>=1.2.0",
    "flask-limiter>=3.5.0",
    "pymupdf>=1.26",
    "pillow>=10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
