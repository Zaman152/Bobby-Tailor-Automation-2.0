<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Bobby Tailor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='v2/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='v2/base.css') }}">
  <style>
    .signin { min-height: 100vh; display: grid; place-items: center; padding: var(--s5); }
    .signin .card { width: 100%; max-width: 380px; }
    .mark { width: 34px; height: 34px; border-radius: 7px; background: var(--accent);
            color: #fff; display: grid; place-items: center;
            font-family: var(--font-ui); font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <main class="signin">
    <form class="card" method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row" style="gap:var(--s3)">
        <div class="mark">BT</div>
        <div class="brand"><b>Bobby Tailor</b><span>Take-off</span></div>
      </div>
      <div class="card-head">
        <h1 style="font-size:1.3rem">Sign in</h1>
        <p class="hint">One operator, one instance. Your reports stay on this machine.</p>
      </div>
      {% if error %}
      <div class="note note-warn"><span class="eyebrow">Could not sign in</span>
        <p>{{ error }}</p></div>
      {% endif %}
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
